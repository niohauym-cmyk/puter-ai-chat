<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مساعد البحث الذكي - Puter AI</title>

  <!-- مكتبة Puter.js من الصور - بدون مفاتيح API -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh; color: #fff; padding: 20px;
    }
    .app { max-width: 860px; margin: 0 auto; }

    header {
      text-align: center; padding: 24px 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px; margin-bottom: 18px;
    }
    header h1 { font-size: 26px; margin-bottom: 6px; }
    header p { color: #c7c5e8; font-size: 14px; }

    .card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px; padding: 18px; margin-bottom: 18px;
    }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #dcd9ff; }

    select, textarea, input[type=text] {
      width: 100%; background: rgba(0,0,0,.35); color: #fff;
      border: 1px solid rgba(255,255,255,.2); border-radius: 12px;
      padding: 12px; font-size: 15px; outline: none;
    }
    select option { background: #302b63; color: #fff; }
    select:focus, textarea:focus, input:focus { border-color: #8b7cf8; }
    textarea { min-height: 90px; resize: vertical; }

    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; color: #dcd9ff; margin: 0; }
    .check input { width: 18px; height: 18px; accent-color: #7c6cf6; }

    /* الزر الرئيسي */
    #sendBtn {
      width: 100%; margin-top: 16px; padding: 15px; font-size: 18px; font-weight: bold;
      color: #fff; background: linear-gradient(135deg, #7c6cf6, #5a8bf6);
      border: none; border-radius: 14px; cursor: pointer; transition: .2s;
    }
    #sendBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,108,246,.4); }
    #sendBtn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .status { display: none; margin-top: 12px; font-size: 14px; color: #ffd479; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #ffd479;
      border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-left: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      border-radius: 14px; padding: 14px; margin-bottom: 12px;
      line-height: 1.9; font-size: 15px; white-space: pre-wrap; word-wrap: break-word;
    }
    .user { background: rgba(124,108,246,.25); border: 1px solid rgba(124,108,246,.5); }
    .bot  { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }
    .msg.error { background: rgba(255,80,80,.15); border: 1px solid rgba(255,80,80,.5); }
    .who { font-size: 12px; color: #a9a4e8; margin-bottom: 6px; font-weight: bold; }

    /* ===== تنسيق عرض الإجابات المنسقة (Markdown) ===== */
    .bot .body { white-space: normal; }
    .body p { margin: 0 0 10px; }
    .body p:last-child { margin-bottom: 0; }
    .body h1, .body h2, .body h3, .body h4 { color: #cfc9ff; margin: 16px 0 8px; line-height: 1.6; }
    .body h1 { font-size: 20px; }
    .body h2 { font-size: 18px; }
    .body h3 { font-size: 16px; }
    .body h4 { font-size: 15px; }
    .body h1:first-child, .body h2:first-child, .body h3:first-child { margin-top: 0; }
    .body ul, .body ol { margin: 0 0 10px; padding-right: 22px; }
    .body li { margin-bottom: 5px; }
    .body code {
      background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12);
      padding: 1px 7px; border-radius: 7px; font-family: Consolas, monospace;
      font-size: 13px; direction: ltr; unicode-bidi: embed;
    }
    .body pre {
      background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px; padding: 13px; overflow-x: auto; margin: 10px 0;
      text-align: left; direction: ltr;
    }
    .body pre code { background: none; border: none; padding: 0; white-space: pre; }
    .body a { color: #9db8ff; }
    .body blockquote {
      border-right: 3px solid #7c6cf6; background: rgba(124,108,246,.1);
      padding: 8px 12px; border-radius: 8px; margin: 10px 0; color: #d6d2f5;
    }
    .body table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 14px; }
    .body th, .body td { border: 1px solid rgba(255,255,255,.18); padding: 6px 12px; }
    .body th { background: rgba(124,108,246,.25); color: #e4e0ff; }
    .body hr { border: none; border-top: 1px solid rgba(255,255,255,.2); margin: 14px 0; }
    .cite {
      background: rgba(124,108,246,.4); color: #d9d4ff; border-radius: 8px;
      padding: 1px 7px; font-size: 11px; margin: 0 2px; vertical-align: super; line-height: 1.4;
    }
    .cite a { color: #d9d4ff; text-decoration: none; }
    .sources {
      margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.15);
      font-size: 13.5px;
    }
    .sources .st { color: #a9a4e8; font-weight: bold; margin-bottom: 6px; }
    .sources ol { margin: 0; padding-right: 20px; }
    .sources li { margin-bottom: 4px; }
    .msg { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .toolbar { display: flex; gap: 10px; }
    .toolbar button {
      flex: 1; padding: 10px; border: none; border-radius: 12px;
      background: rgba(255,255,255,.1); color: #fff; font-size: 14px; cursor: pointer;
    }
    .toolbar button:hover { background: rgba(255,255,255,.2); }

    footer { text-align: center; font-size: 12.5px; color: #9d99c9; margin-top: 10px; line-height: 1.8; }
  </style>
</head>
<body>
<div class="app">

  <header>
    <h1>🤖 مساعد البحث الذكي</h1>
    <p>مدعوم بنماذج Perplexity عبر Puter.js — بدون مفاتيح API</p>
  </header>

  <div class="card">
    <label>اختر النموذج:</label>
    <select id="model">
      <option value="perplexity/sonar">sonar — بحث سريع</option>
      <option value="perplexity/sonar-pro">sonar-pro — بحث احترافي</option>
      <option value="perplexity/sonar-pro-search">sonar-pro-search — بحث متقدم بالمصادر</option>
      <option value="perplexity/sonar-deep-research">sonar-deep-research — بحث عميق وشامل (أبطأ لكن مفصّل)</option>
      <option value="perplexity/sonar-reasoning-pro">sonar-reasoning-pro — تفكير منطقي وتحليل</option>
    </select>

    <label style="margin-top:14px">اكتب سؤالك:</label>
    <textarea id="question" placeholder="مثال: ما أحدث التطورات في أبحاث الحاسوب الكمي؟"></textarea>

    <label style="margin-top:14px">رابط صورة لتحليلها (اختياري):</label>
    <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg" dir="ltr" />

    <div class="row">
      <label class="check">
        <input type="checkbox" id="stream" checked />
        عرض الإجابة أثناء كتابتها (بث مباشر)
      </label>
    </div>

    <!-- الزر: عند الضغط عليه يتم البحث -->
    <button id="sendBtn" onclick="send()">🚀 ابحث الآن</button>

    <div class="status" id="status"><span class="spinner"></span><span id="statusText"> جاري البحث...</span></div>
  </div>

  <div class="card">
    <div id="chat"></div>
    <div class="toolbar">
      <button onclick="copyLast()">📋 نسخ آخر إجابة</button>
      <button onclick="clearChat()">🗑️ محادثة جديدة</button>
    </div>
  </div>

  <footer>
    ⚠️ مطلوب اتصال بالإنترنت • أول مرة قد تظهر نافذة تسجيل دخول مجاني من Puter — سجّل دخولاً مجانياً وسيعمل كل شيء
  </footer>
</div>

<script>
  let lastAnswer = "";
  let busy = false;

  function $(id) { return document.getElementById(id); }
  function scrollDown() { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" }); }
  function showStatus(t) { $("status").style.display = "block"; $("statusText").textContent = " " + t; }
  function hideStatus() { $("status").style.display = "none"; }

  // إضافة رسالة جديدة (من المستخدم أو من المساعد) إلى منطقة المحادثة
  function addMsg(cls, who, text) {
    const outer = document.createElement("div");
    outer.className = "msg " + cls;
    const w = document.createElement("div"); w.className = "who"; w.textContent = who;
    const b = document.createElement("div"); b.className = "body"; b.textContent = text;
    outer.appendChild(w); outer.appendChild(b);
    $("chat").appendChild(outer);
    scrollDown();
    return { outer, body: b };
  }

  // استخراج النص من رد Puter سواء كان نصاً أو كائناً
  function getText(resp) {
    if (resp == null) return "";
    if (typeof resp === "string") return resp;
    if (typeof resp.text === "string") return resp.text;
    const c = resp.message && resp.message.content;
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.map(p => p.text || "").join("");
    return JSON.stringify(resp, null, 2);
  }

  // ======= الدالة الرئيسية: تعمل عند الضغط على زر "ابحث الآن" =======
  async function send() {
    if (busy) return;
    const q = $("question").value.trim();
    if (!q) { alert("اكتب سؤالك أولاً 🙂"); return; }
    if (typeof puter === "undefined" || !puter.ai) {
      alert("تعذّر تحميل مكتبة Puter — تأكد من اتصالك بالإنترنت ثم أعد تحميل الصفحة");
      return;
    }

    const model = $("model").value;
    const useStream = $("stream").checked;
    const imgUrl = $("imageUrl").value.trim();

    busy = true;
    $("sendBtn").disabled = true;
    addMsg("user", "أنت", q);
    const M = addMsg("bot", "المساعد", "");
    showStatus("جاري البحث، انتظر قليلا...");

    let raw = "";
    let respObj = null;
    try {
      if (useStream) {
        // بث مباشر مثل المثال 5 في الصور
        const response = imgUrl
          ? await puter.ai.chat(q, imgUrl, { model, stream: true })
          : await puter.ai.chat(q, { model, stream: true });
        respObj = response;

        let scheduled = false;
        for await (const part of response) {
          if (part && part.text) {
            raw += part.text;
            // إعادة التنسيق أثناء البث (مرة واحدة لكل إطار لضمان السلاسة)
            if (!scheduled) {
              scheduled = true;
              requestAnimationFrame(() => {
                M.body.innerHTML = renderMarkdown(raw, []);
                scrollDown();
                scheduled = false;
              });
            }
          }
          if (part && (part.citations || part.search_results)) respObj = part;
        }
      } else {
        // إجابة كاملة دفعة واحدة مثل المثال 1 في الصور
        const response = imgUrl
          ? await puter.ai.chat(q, imgUrl, { model })
          : await puter.ai.chat(q, { model });
        respObj = response;
        raw = getText(response);
      }

      lastAnswer = raw;
      if (!raw.trim()) {
        M.body.textContent = "لم تصل إجابة. حاول مرة أخرى.";
      } else {
        finishMessage(M, raw, respObj);
      }
    } catch (err) {
      M.outer.classList.add("error");
      M.body.textContent = "❌ حدث خطأ: " + (err && err.message ? err.message : err)
        + "\n💡 تأكد من اتصال الإنترنت، وأغلق أي نافذة حجب (popup blocker) وحاول مجدداً.";
    } finally {
      hideStatus();
      busy = false;
      $("sendBtn").disabled = false;
      scrollDown();
    }
  }

  // ================================================================
  // محرك تنسيق خفيف: يحوّل إجابة الذكاء الاصطناعي (Markdown) إلى HTML
  // منسق وجميل: عناوين، قوائم، جداول، أكواد، روابط، وأرقام المصادر
  // ================================================================
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // تنسيقات داخل السطر: كود، روابط، عريض، مائل، وشرائح أرقام المصادر
  function inlineFmt(t, cites) {
    const stash = [];
    const keep = html => { stash.push(html); return "\u0003" + (stash.length - 1) + "\u0003"; };

    // كود داخل السطر `code`
    t = t.replace(/`([^`\n]+)`/g, (m, c) => keep("<code>" + c + "</code>"));
    // روابط بصيغة [نص](رابط)
    t = t.replace(/\[([^\]\n]+)\]\((https?:[^\s)]+)\)/g, (m, txt, url) =>
      keep('<a href="' + url + '" target="_blank" rel="noopener">' + txt + "</a>"));
    // روابط مباشرة http...
    t = t.replace(/\bhttps?:\/\/[^\s<>\u0003]+/g, m =>
      keep('<a href="' + m + '" target="_blank" rel="noopener">' + m + "</a>"));
    // عريض **نص**
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    // مائل *نص*
    t = t.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    // إزالة أرقام المصادر [1] أو [1][4][7] من النص تماماً
    t = t.replace(/\[\s*\d{1,3}\s*\](?:[ \u00a0]*\[\s*\d{1,3}\s*\])*/g, "");
    // تنظيف المسافات المتبقية بعد الإزالة
    t = t.replace(/[ \u00a0]{2,}/g, " ").replace(/[ \u00a0]+([.,،؛:!؟?])/g, "$1");
    // إرجاع الأجزاء المحفوظة
    t = t.replace(/\u0003(\d+)\u0003/g, (m, i) => stash[+i]);
    return t;
  }

  // المحرك الرئيسي: نص Markdown -> HTML منسق
  function renderMarkdown(src, cites) {
    cites = cites || [];
    // إزالة كتل التفكير من نماذج التفكير (<think>)
    let text = String(src || "").replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
    text = escapeHtml(text);
    // ضمان وجود أسوار الأكواد على أسطر مستقلة (مع الحفاظ على اسم اللغة)
    text = text.replace(/```([a-zA-Z0-9+#._-]*)/g, "\n```$1\n");

    // استخراج كتل الأكواد
    const codeBlocks = [];
    text = text.replace(/```[a-zA-Z0-9+#._-]*\n?([\s\S]*?)```/g, (m, code) => {
      codeBlocks.push("<pre><code>" + code.replace(/^\n+/, "").replace(/\n+$/, "") + "</code></pre>");
      return "\u0000B" + (codeBlocks.length - 1) + "\u0000";
    });

    const lines = text.split("\n");
    let html = "", para = [], list = null;

    const flushPara = () => { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
    const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };
    const openList = type => { if (list !== type) { closeList(); html += "<" + type + ">"; list = type; } };
    const emit = x => { flushPara(); closeList(); html += x; };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const trimmed = line.trim();

      // كتلة كود محفوظة
      const cb = trimmed.match(/^\u0000B(\d+)\u0000$/);
      if (cb) { emit(codeBlocks[+cb[1]]); continue; }
      // سطر فارغ
      if (!trimmed) { flushPara(); closeList(); continue; }
      // عنوان ## 
      const h = trimmed.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        const lvl = Math.min(h[1].length, 4);
        emit("<h" + lvl + ">" + inlineFmt(h[2], cites) + "</h" + lvl + ">");
        continue;
      }
      // خط فاصل --- أو ***
      if (/^([-*_=]\s?){3,}$/.test(trimmed)) { emit("<hr>"); continue; }
      // اقتباس >
      if (/^&gt;\s?/.test(trimmed)) {
        emit("<blockquote>" + inlineFmt(trimmed.replace(/^&gt;\s?/, ""), cites) + "</blockquote>");
        continue;
      }
      // جدول | عمود | عمود |
      if (/^\|/.test(trimmed) && i + 1 < lines.length && lines[i + 1].includes("-") && /^[\s|:\-]+$/.test(lines[i + 1])) {
        const parseRow = row => row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
        const head = parseRow(trimmed);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes("|")) { rows.push(parseRow(lines[i])); i++; }
        i--;
        let tHtml = "<table><tr>" + head.map(c => "<th>" + inlineFmt(c, cites) + "</th>").join("") + "</tr>";
        rows.forEach(r => { tHtml += "<tr>" + r.map(c => "<td>" + inlineFmt(c, cites) + "</td>").join("") + "</tr>"; });
        emit(tHtml + "</table>");
        continue;
      }
      // قائمة نقطية
      const ul = trimmed.match(/^[-*•]\s+(.*)$/);
      if (ul) { openList("ul"); para = []; html += "<li>" + inlineFmt(ul[1], cites) + "</li>"; continue; }
      // قائمة مرقمة
      const ol = trimmed.match(/^\d{1,2}[.)]\s+(.*)$/);
      if (ol) { openList("ol"); para = []; html += "<li>" + inlineFmt(ol[1], cites) + "</li>"; continue; }

      para.push(inlineFmt(trimmed, cites));
    }
    flushPara();
    closeList();
    return html;
  }

  // استخراج قائمة المصادر من رد Puter إن وُجدت
  function extractCitations(resp) {
    let arr = null;
    if (resp && typeof resp === "object") {
      arr = resp.citations || resp.search_results ||
            (resp.message && (resp.message.citations || resp.message.search_results)) || null;
    }
    if (!Array.isArray(arr)) return [];
    return arr.map(it => {
      if (typeof it === "string") return { url: it, title: it };
      if (it && typeof it === "object") {
        const url = it.url || it.link || "";
        const title = it.title || it.name || url;
        return url ? { url: String(url), title: String(title) } : null;
      }
      return null;
    }).filter(c => c && /^https?:/i.test(c.url)).slice(0, 20);
  }

  // قائمة المصادر أسفل الإجابة
  function sourcesHtml(cites) {
    let h = '<div class="sources"><div class="st">📚 المصادر:</div><ol>';
    cites.forEach(c => {
      h += '<li><a href="' + escapeHtml(c.url) + '" target="_blank" rel="noopener">' + escapeHtml(c.title) + "</a></li>";
    });
    return h + "</ol></div>";
  }

  // عرض الإجابة النهائية منسقة مع المصادر
  function finishMessage(M, raw, respObj) {
    const cites = extractCitations(respObj);
    M.body.innerHTML = renderMarkdown(raw, cites) + (cites.length ? sourcesHtml(cites) : "");
    scrollDown();
  }

  // معاينة تجريبية: افتح الصفحة مع ?demo لرؤية شكل الإجابات المنسقة
  if (location.search.indexOf("demo") !== -1) {
    addMsg("user", "أنت", "ما فوائد البصل؟");
    const B = addMsg("bot", "المساعد", "");
    const sample = `## فوائد البصل الصحية
يُعد البصل من **أفيد الخضار** للجسم، وأبرز فوائده:

- غني بمضادات الأكسدة التي تقاوم **الالتهابات** [1][4][7].
- يحتوي على *الكيرسيتين* الذي يدعم صحة **القلب** ويخفض ضغط الدم [2][5].
- يساعد على تنظيم سكر الدم [1][3].
- يدعم المناعة بفضل مركبات **الكبريت** الطبيعية [4].

| العنصر | الفائدة |
|---|---|
| الكيرسيتين | مضاد أكسدة قوي |
| الكبريت | مضاد بكتيري |

\`\`\`python
# مثال بسيط
print("البصل مفيد!")
\`\`\`

> ملاحظة: استشر الطبيب قبل أي استخدام علاجي.
وإذا أردت، أستطيع إرسال وصفة لشاي البصل [2].`;
    const cites = [
      { title: "Healthline - Onion benefits", url: "https://www.healthline.com/nutrition/onion-benefits" },
      { title: "WebMD - Onion overview", url: "https://www.webmd.com/vitamins/ai/ingredientmono-643-onion" }
    ];
    B.body.innerHTML = renderMarkdown(sample, cites) + sourcesHtml(cites);
  }

  // نسخ آخر إجابة
  function copyLast() {
    if (!lastAnswer) { alert("لا توجد إجابة بعد"); return; }
    const done = () => alert("✅ تم نسخ الإجابة");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastAnswer).then(done).catch(() => fallbackCopy(done));
    } else { fallbackCopy(done); }
  }
  function fallbackCopy(done) {
    const t = document.createElement("textarea");
    t.value = lastAnswer; document.body.appendChild(t); t.select();
    document.execCommand("copy"); document.body.removeChild(t); done();
  }

  // محادثة جديدة
  function clearChat() { $("chat").innerHTML = ""; lastAnswer = ""; }

  // إرسال سريع بالضغط على Ctrl + Enter
  $("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send();
  });
</script>
</body>
</html>
